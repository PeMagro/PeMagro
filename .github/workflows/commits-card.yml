name: Card de commits

on:
  push:
    branches: [main]
    paths-ignore: ["assets/commits-*.svg"]
  schedule:
    - cron: "0 9 * * *" # todo dia às 06:00 (Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar card
        run: python3 .github/scripts/commits_card.py
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          # Opcional: crie o secret COMMITS_TOKEN (PAT) para contar também commits privados
          GH_TOKEN: ${{ secrets.COMMITS_TOKEN || github.token }}

      - name: Salvar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/commits-*.svg
          git diff --cached --quiet || (git commit -m "Atualiza card de commits" && git push)
