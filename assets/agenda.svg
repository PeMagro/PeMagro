<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <clipPath id="r"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out both}
      @keyframes pop{from{transform:scale(0)}}
    </style>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle cx="930" cy="160" r="150" fill="#6366F1" opacity=".35" filter="url(#blur)"/>
  </g>
  <rect width="1200" height="320" rx="20" fill="none" stroke="#312E81"/>

  <text x="64" y="86" font-size="14" font-weight="700" fill="#FBBF24" letter-spacing="4">★ PROJETO EM DESTAQUE</text>
  <text x="64" y="140" font-size="44" font-weight="800" fill="#F8FAFC">Agenda-das-Faculdades</text>
  <rect x="64" y="158" width="120" height="4" rx="2" fill="url(#acc)"/>
  <text x="64" y="196" font-size="18" fill="#CBD5E1">Organizador offline de tarefas, provas e lembretes</text>
  <text x="64" y="222" font-size="18" fill="#CBD5E1">de duas faculdades, com calendário e chat com o Claude.</text>
  <rect x="64" y="250" width="168" height="38" rx="19" fill="url(#acc)"/>
  <text x="148" y="274" font-size="15" font-weight="700" fill="#0B1020" text-anchor="middle">Ver projeto →</text>
  <rect x="244" y="250" width="176" height="38" rx="19" fill="none" stroke="#475569"/>
  <text x="332" y="274" font-size="14" font-weight="600" fill="#CBD5E1" text-anchor="middle">Electron + SQLite</text>

