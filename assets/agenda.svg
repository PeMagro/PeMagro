      <rect x="19" y="84" width="18" height="18" rx="5"/><rect x="41" y="84" width="18" height="18" rx="5"/><rect x="63" y="84" width="18" height="18" rx="5"/><rect x="85" y="84" width="18" height="18" rx="5"/><rect x="107" y="84" width="18" height="18" rx="5"/><rect x="129" y="84" width="18" height="18" rx="5"/><rect x="151" y="84" width="18" height="18" rx="5"/>
      <rect x="19" y="106" width="18" height="18" rx="5"/><rect x="41" y="106" width="18" height="18" rx="5"/><rect x="63" y="106" width="18" height="18" rx="5"/><rect x="85" y="106" width="18" height="18" rx="5"/><rect x="107" y="106" width="18" height="18" rx="5"/><rect x="129" y="106" width="18" height="18" rx="5"/><rect x="151" y="106" width="18" height="18" rx="5"/>
