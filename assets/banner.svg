<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset=".55" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".05"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
    <clipPath id="r"><rect width="1200" height="360" rx="22"/></clipPath>
    <style>
      .b{transform-box:fill-box;transform-origin:bottom;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
      @keyframes grow{from{transform:scaleY(0)}}
      .ln{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.6s .6s ease-out forwards}
      @keyframes draw{to{stroke-dashoffset:0}}
      .dn{animation:spin 1.4s .3s ease-out both}
      @keyframes spin{from{stroke-dasharray:0 226}}
      .pulse{animation:p 2.4s ease-in-out infinite}
      @keyframes p{50%{opacity:.35}}
    </style>
  </defs>

  <g clip-path="url(#r)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="1000" cy="60" r="150" fill="#7C3AED" opacity=".45" filter="url(#blur)"/>
    <circle cx="720" cy="340" r="130" fill="#06B6D4" opacity=".3" filter="url(#blur)"/>
    <circle cx="80" cy="30" r="110" fill="#4F46E5" opacity=".3" filter="url(#blur)"/>
  </g>

  <!-- Texto -->
  <text x="64" y="112" font-size="16" font-weight="600" fill="#94A3B8" letter-spacing="5">DEV DE BI &amp; INTEGRAÇÃO</text>
  <text x="64" y="178" font-size="50" font-weight="800" fill="#F8FAFC">Olá, eu sou o Pedro 👋</text>
  <text x="64" y="224" font-size="21" font-weight="600" fill="url(#txt)">Transformo dados em decisões e conecto sistemas.</text>

  <g font-size="14" font-weight="600">
    <rect x="64" y="256" width="72" height="32" rx="16" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".5"/>
    <text x="100" y="277" text-anchor="middle" fill="#67E8F9">SQL</text>
    <rect x="146" y="256" width="92" height="32" rx="16" fill="#818CF8" fill-opacity=".12" stroke="#818CF8" stroke-opacity=".5"/>
    <text x="192" y="277" text-anchor="middle" fill="#A5B4FC">Oracle</text>
    <rect x="248" y="256" width="72" height="32" rx="16" fill="#C084FC" fill-opacity=".12" stroke="#C084FC" stroke-opacity=".5"/>
    <text x="284" y="277" text-anchor="middle" fill="#D8B4FE">OIC</text>
    <rect x="330" y="256" width="128" height="32" rx="16" fill="#FBBF24" fill-opacity=".12" stroke="#FBBF24" stroke-opacity=".5"/>
    <text x="394" y="277" text-anchor="middle" fill="#FCD34D">Claude Code</text>
  </g>

  <!-- Card de dashboard -->
  <g>
    <rect x="720" y="44" width="424" height="272" rx="16" fill="#0F172A" fill-opacity=".75" stroke="#334155"/>
    <circle cx="744" cy="68" r="5" fill="#F87171"/>
    <circle cx="760" cy="68" r="5" fill="#FBBF24"/>
    <circle cx="776" cy="68" r="5" fill="#34D399"/>
    <text x="800" y="73" font-size="13" fill="#94A3B8">painel_vendas.sql</text>
    <circle cx="1122" cy="68" r="5" fill="#34D399" class="pulse"/>
    <text x="1110" y="73" font-size="11" fill="#34D399" text-anchor="end">ao vivo</text>

    <!-- KPIs -->
    <g font-size="11" fill="#94A3B8">
      <rect x="744" y="88" width="120" height="54" rx="10" fill="#1E293B"/>
      <text x="756" y="108">Receita</text>
      <text x="756" y="131" font-size="18" font-weight="700" fill="#F8FAFC">R$ 1,2M</text>
      <rect x="874" y="88" width="120" height="54" rx="10" fill="#1E293B"/>
      <text x="886" y="108">Margem</text>
      <text x="886" y="131" font-size="18" font-weight="700" fill="#F8FAFC">24%</text>
      <text x="934" y="131" font-size="12" font-weight="700" fill="#34D399">▲ 3,1</text>
      <rect x="1004" y="88" width="120" height="54" rx="10" fill="#1E293B"/>
      <text x="1016" y="108">Meta</text>
      <text x="1016" y="131" font-size="18" font-weight="700" fill="#FBBF24">112%</text>
    </g>

    <!-- Barras -->
    <g fill="url(#bar)">
      <rect class="b" x="748" y="250" width="22" height="46" rx="4" style="animation-delay:.05s"/>
      <rect class="b" x="782" y="228" width="22" height="68" rx="4" style="animation-delay:.12s"/>
      <rect class="b" x="816" y="240" width="22" height="56" rx="4" style="animation-delay:.19s"/>
      <rect class="b" x="850" y="210" width="22" height="86" rx="4" style="animation-delay:.26s"/>
      <rect class="b" x="884" y="222" width="22" height="74" rx="4" style="animation-delay:.33s"/>
      <rect class="b" x="918" y="196" width="22" height="100" rx="4" style="animation-delay:.40s"/>
      <rect class="b" x="952" y="206" width="22" height="90" rx="4" style="animation-delay:.47s"/>
      <rect class="b" x="986" y="180" width="22" height="116" rx="4" style="animation-delay:.54s"/>
    </g>
    <polyline class="ln" points="759,236 793,214 827,226 861,196 895,208 929,182 963,192 997,166" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="997" cy="166" r="4.5" fill="#FBBF24"/>
    <line x1="744" y1="297" x2="1016" y2="297" stroke="#334155"/>

    <!-- Donut -->
    <circle cx="1080" cy="236" r="36" fill="none" stroke="#1E293B" stroke-width="12"/>
    <circle class="dn" cx="1080" cy="236" r="36" fill="none" stroke="#C084FC" stroke-width="12" stroke-linecap="round" stroke-dasharray="163 226" transform="rotate(-90 1080 236)"/>
    <text x="1080" y="241" font-size="15" font-weight="700" fill="#F8FAFC" text-anchor="middle">72%</text>
    <text x="1080" y="292" font-size="10" fill="#94A3B8" text-anchor="middle">integrações OK</text>
  </g>
</svg>
