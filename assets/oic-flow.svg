<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset=".5" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F43F5E"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <style>
      .f{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-28}}
      .ring{transform-box:fill-box;transform-origin:center;animation:r 2.6s ease-out infinite}
      @keyframes r{from{transform:scale(1);opacity:.6}to{transform:scale(1.6);opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="240" rx="20" fill="url(#bg)" stroke="#312E81"/>

  <!-- linhas de entrada -->
  <g fill="none" stroke-width="2">
    <path class="f" d="M270 60 C 420 60, 450 120, 540 120" stroke="#22D3EE"/>
    <path class="f" d="M270 120 L 540 120" stroke="#22D3EE"/>
    <path class="f" d="M270 180 C 420 180, 450 120, 540 120" stroke="#22D3EE"/>
    <path class="f" d="M660 120 C 750 120, 780 60, 930 60" stroke="#FBBF24"/>
    <path class="f" d="M660 120 L 930 120" stroke="#FBBF24"/>
    <path class="f" d="M660 120 C 750 120, 780 180, 930 180" stroke="#FBBF24"/>
  </g>

  <!-- origens -->
  <g font-size="15" font-weight="600" fill="#E2E8F0">
    <rect x="80" y="38" width="190" height="44" rx="12" fill="#0F172A" stroke="#22D3EE" stroke-opacity=".6"/>
    <text x="175" y="66" text-anchor="middle">ERP</text>
    <rect x="80" y="98" width="190" height="44" rx="12" fill="#0F172A" stroke="#22D3EE" stroke-opacity=".6"/>
    <text x="175" y="126" text-anchor="middle">HCM / CRM</text>
    <rect x="80" y="158" width="190" height="44" rx="12" fill="#0F172A" stroke="#22D3EE" stroke-opacity=".6"/>
    <text x="175" y="186" text-anchor="middle">Bancos de dados</text>
  </g>

  <!-- hub OIC -->
  <circle class="ring" cx="600" cy="120" r="58" fill="none" stroke="#C084FC" stroke-width="2"/>
  <circle cx="600" cy="120" r="58" fill="url(#hub)"/>
  <text x="600" y="118" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">OIC</text>
  <text x="600" y="138" font-size="11" fill="#FFE4E6" text-anchor="middle">orquestra · mapeia</text>

  <!-- destinos -->
  <g font-size="15" font-weight="600" fill="#E2E8F0">
    <rect x="930" y="38" width="190" height="44" rx="12" fill="#0F172A" stroke="#FBBF24" stroke-opacity=".6"/>
    <text x="1025" y="66" text-anchor="middle">APIs REST / SOAP</text>
    <rect x="930" y="98" width="190" height="44" rx="12" fill="#0F172A" stroke="#FBBF24" stroke-opacity=".6"/>
    <text x="1025" y="126" text-anchor="middle">Data Warehouse</text>
    <rect x="930" y="158" width="190" height="44" rx="12" fill="#0F172A" stroke="#FBBF24" stroke-opacity=".6"/>
    <text x="1025" y="186" text-anchor="middle">Dashboards de BI</text>
  </g>
</svg>
